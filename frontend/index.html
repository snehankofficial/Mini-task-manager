<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/task-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern task management application built with React and Tailwind CSS" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Mini Task Manager</title>

    <style>
        /* Loading styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Hide loading screen when app loads */
        .app-loaded .loading-screen {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }

        /* Ensure body doesn't scroll when loading */
        body.loading {
            overflow: hidden;
        }
    </style>
</head>

<body class="loading">
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <!-- Main App Root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
        // Remove loading class when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                document.body.classList.remove('loading');
                document.body.classList.add('app-loaded');
            }, 500);
        });
    </script>
</body>

</html>
